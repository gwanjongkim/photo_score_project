dataset:
  train_jsonl_strict: outputs/alamp_paper_strict_patch_selector_20260512/train_patch_boxes_1024_strict.jsonl
  val_jsonl_strict: outputs/alamp_paper_strict_patch_selector_20260512/val_patch_boxes_1024_strict.jsonl
  test_jsonl_strict: outputs/alamp_paper_strict_patch_selector_20260512/test_patch_boxes_1024_strict.jsonl
  
  train_jsonl_v4: outputs/alamp_paper_mpnet_patch_selector_v4_20260512/subsets/train_patch_boxes_1024_v4.jsonl
  val_jsonl_v4: outputs/alamp_paper_mpnet_patch_selector_v4_20260512/subsets/val_patch_boxes_1024_v4.jsonl
  test_jsonl_v4: outputs/alamp_paper_mpnet_patch_selector_v4_20260512/subsets/test_patch_boxes_1024_v4.jsonl

model:
  backbone_weights: imagenet
  feature_dim: 256
  dropout_rate: 0.5

training:
  epochs: 10
  batch_size: 4
  learning_rate: 1.0e-4
  early_stopping_patience: 3
  output_dir: outputs/alamp_paper_mpnet_selector_compare_20260512/train

evaluation:
  batch_size: 4
  output_dir: outputs/alamp_paper_mpnet_selector_compare_20260512/eval
