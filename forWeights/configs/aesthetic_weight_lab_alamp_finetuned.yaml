models:
  nima:
    enabled: true
    type: nima_distribution
    model_path: models/aesthetic/nima_mobile.tflite
    input_width: 224
    input_height: 224
    normalization: zero_to_one

  rgnet:
    enabled: true
    type: scalar_tflite
    model_path: models/aesthetic/rgnet_aadb_gpu.tflite
    input_width: 256
    input_height: 256
    normalization: zero_to_one

  alamp:
    enabled: true
    type: alamp_signature
    model_path: models/aesthetic/alamp_ava_aadb_finetune.tflite
    global_size: 384
    patch_size: 224
    patch_count: 5
    normalization: zero_to_one
    preprocessing:
      global: resize_with_pad
      patches: adaptive_saliency_like

weights:
  nima: 0.34
  rgnet: 0.33
  alamp: 0.33

report:
  title: "A-cut Aesthetic Weight Lab - Fine-tuned A-LAMP"
  thumbnail_size: 240
  copy_original_images: true
  enable_interactive_weight_controls: true
